<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приглашение на бильярд</title>
    <style>
        :root {
            --pink: #FFD1DC;
            --pink-dark: #FF69B4;
            --white: #FFFFFF;
            --gray: #D3D3DC;
            --text: #333;
            --lilac: #C8A2C8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--pink);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Экран телефона */
        .phone-frame {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            position: relative;
            overflow: hidden;
            background: var(--pink);
        }

        /* Волнистый фон (розовый) */
        .wave-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            -webkit-mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 100 100'><rect width='100' height='100' fill='white'/><path d='M0,20 Q10,10 20,20 T40,20 T60,20 T80,20 T100,20 V80 Q90,90 80,80 T60,80 T40,80 T20,80 T0,80 Z' fill='black'/></svg>");
            mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 100 100'><rect width='100' height='100' fill='white'/><path d='M0,20 Q10,10 20,20 T40,20 T60,20 T80,20 T100,20 V80 Q90,90 80,80 T60,80 T40,80 T20,80 T0,80 Z' fill='black'/></svg>");
            -webkit-mask-repeat: repeat;
            mask-repeat: repeat;
        }

        /* Облака в фоне */
        .cloud {
            position: absolute;
            opacity: 0.6;
        }

        .cloud-1 {
            top: 5%;
            left: 5%;
            width: 40px;
            height: 40px;
            background: #A0D2FF;
            border-radius: 50%;
            box-shadow: 15px 0 0 #A0D2FF, 8px 10px 0 #A0D2FF, -5px 8px 0 #A0D2FF;
        }

        .cloud-2 {
            top: 15%;
            right: 8%;
            width: 30px;
            height: 30px;
            background: #FFB6C1;
            border-radius: 50%;
            box-shadow: 12px 0 0 #FFB6C1, 6px 8px 0 #FFB6C1, -4px 6px 0 #FFB6C1;
        }

        /* Центральный белый контейнер с волнистыми краями */
        .card {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            background: var(--white);
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            -webkit-mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 100 100'><rect width='100' height='100' fill='white'/><path d='M0,20 Q10,10 20,20 T40,20 T60,20 T80,20 T100,20 V80 Q90,90 80,80 T60,80 T40,80 T20,80 T0,80 Z' fill='black'/></svg>");
            mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 100 100'><rect width='100' height='100' fill='white'/><path d='M0,20 Q10,10 20,20 T40,20 T60,20 T80,20 T100,20 V80 Q90,90 80,80 T60,80 T40,80 T20,80 T0,80 Z' fill='black'/></svg>");
            -webkit-mask-repeat: repeat;
            mask-repeat: repeat;
        }

        /* Страницы */
        .page {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Картинка */
        .page-img {
            width: 100%;
            max-width: 200px;
            height: auto;
            margin: 0 auto 20px;
            border-radius: 15px;
            object-fit: cover;
            display: block;
        }

        /* Текст */
        .page-title {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 15px;
            line-height: 1.3;
        }

        .page-subtitle {
            font-size: 1rem;
            color: #666;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        /* Кнопки */
        .btn {
            width: 100%;
            max-width: 300px;
            padding: 14px 30px;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 8px 0;
        }

        .btn-pink {
            background: linear-gradient(135deg, #FF69B4, #FF1493);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.4);
        }

        .btn-pink:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 105, 180, 0.6);
        }

        .btn-gray {
            background: #D3D3DC;
            color: #555;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .btn-gray:hover {
            background: #C0C0CA;
            transform: translateY(-2px);
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        /* Поля ввода */
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-label {
            display: block;
            font-size: 1rem;
            color: var(--pink-dark);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .input-field {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--gray);
            border-radius: 25px;
            font-size: 1rem;
            outline: none;
            transition: border 0.3s ease;
        }

        .input-field:focus {
            border-color: var(--pink-dark);
        }

        /* Иконка clapboard */
        .clapboard-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .clapboard-icon svg {
            width: 100%;
            height: 100%;
        }

        /* Страница 5: финал */
        .final-page {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            padding: 40px 20px;
        }

        .final-text {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--lilac);
            text-align: center;
            line-height: 1.4;
            margin-bottom: 20px;
        }

        .final-heart {
            width: 60px;
            height: 60px;
            fill: var(--lilac);
            animation: heartbeat 1.5s ease-in-out infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="wave-bg"></div>
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>

        <!-- Страница 1: Вопрос с Да/Нет -->
        <div class="card page active" id="page1">
            <img class="page-img" src="3.web" alt="Кот с бильярдным ключом">
            <div class="page-title">ты пойдёшь же пойдёшь<br>со мной завтра в бильярд?</div>
            <div class="btn-group">
                <button class="btn btn-pink" onclick="goToPage(2)">Да</button>
                <button class="btn btn-gray" onclick="goToPage(1)">Нет</button>
            </div>
        </div>

        <!-- Страница 2: Чудесно! -->
        <div class="card page" id="page2">
            <img class="page-img" src="2.gif" alt="Счастливый кот">
            <div class="page-title">чудесно!</div>
            <div class="page-subtitle">Теперь давай выберем время</div>
            <button class="btn btn-pink" onclick="goToPage(3)">Да</button>
        </div>

        <!-- Страница 3: Выбор даты и времени -->
        <div class="card page" id="page3">
            <img class="page-img" src="1.gif" alt="Кот с бильярдным столом">
            <div class="page-title">я предлагаю:</div>
            <div class="input-group">
                <label class="input-label" for="date-input">Дата</label>
                <input class="input-field" type="date" id="date-input" value="2026-11-08">
            </div>
            <div class="input-group">
                <label class="input-label" for="time-input">Время</label>
                <input class="input-field" type="time" id="time-input" value="16:30">
            </div>
            <button class="btn btn-pink" onclick="goToPage(4)">Окей</button>
        </div>

        <!-- Страница 4: Если время не подходит -->
        <div class="card page" id="page4">
            <div class="clapboard-icon">
                <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="15" y="35" width="70" height="50" rx="5" fill="#333"/>
                    <rect x="20" y="40" width="60" height="40" rx="3" fill="#555"/>
                    <rect x="25" y="45" width="50" height="30" rx="2" fill="#777"/>
                    <path d="M30 20 L40 10 L80 10 L70 20" fill="#333"/>
                    <path d="M35 25 L45 15 L75 15 L65 25" fill="#555"/>
                    <rect x="30" y="55" width="40" height="3" fill="#FFF"/>
                    <rect x="30" y="65" width="30" height="3" fill="#FFF"/>
                    <rect x="30" y="75" width="25" height="3" fill="#FFF"/>
                </svg>
            </div>
            <div class="page-title">если время не подходит,<br>то напиши когда</div>
            <div class="page-subtitle">А так будь готова 16:00, думаю как обычно пойду к тебе навстречу и оттуда потопаем</div>
            <button class="btn btn-pink" onclick="goToPage(5)">Окей</button>
        </div>

        <!-- Страница 5: Финал -->
        <div class="card page" id="page5">
            <div class="final-page">
                <div class="final-text">Буду тебя ждать</div>
                <svg class="final-heart" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <path d="M50 90 C10 60, 0 35, 0 25 C0 11, 11 0, 25 0 C37 0, 44 8, 50 18 C56 8, 63 0, 75 0 C89 0, 100 11, 100 25 C100 35, 90 60, 50 90 Z"/>
                </svg>
            </div>
        </div>
    </div>

    <script>
        function goToPage(pageNum) {
            // Скрываем все страницы
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });

            // Показываем выбранную страницу
            document.getElementById('page' + pageNum).classList.add('active');

            // Прокручиваем вверх
            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
